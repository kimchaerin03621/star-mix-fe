<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,400;0,600;0,700;1,700&family=Orbitron:wght@600;800;900&family=Share+Tech+Mono&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WOOJOO PLAY</title>
  <script>
    window.addEventListener('error', (event) => {
      const div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '10px';
      div.style.left = '10px';
      div.style.padding = '20px';
      div.style.background = 'red';
      div.style.color = 'white';
      div.style.zIndex = '99999';
      div.style.fontSize = '14px';
      div.style.fontFamily = 'monospace';
      div.style.whiteSpace = 'pre-wrap';
      div.style.maxWidth = '90vw';
      div.style.maxHeight = '90vh';
      div.style.overflow = 'auto';
      div.innerText = `Error: ${event.message}\nAt: ${event.filename}:${event.lineno}:${event.colno}\nStack: ${event.error?.stack || 'No stack trace'}`;
      document.body.appendChild(div);
    });
    window.addEventListener('unhandledrejection', (event) => {
      const div = document.createElement('div');
      div.style.position = 'fixed';
      div.style.top = '10px';
      div.style.left = '10px';
      div.style.padding = '20px';
      div.style.background = 'orange';
      div.style.color = 'black';
      div.style.zIndex = '99999';
      div.style.fontSize = '14px';
      div.style.fontFamily = 'monospace';
      div.style.whiteSpace = 'pre-wrap';
      div.style.maxWidth = '90vw';
      div.style.maxHeight = '90vh';
      div.style.overflow = 'auto';
      div.innerText = `Promise Rejection: ${event.reason?.message || event.reason}\nStack: ${event.reason?.stack || 'No stack trace'}`;
      document.body.appendChild(div);
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
